<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBIS BRAIN | Conectividad v6.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --black-mate: #121212; --black-deep: #0a0a0a; --gold-metalic: #d4af37;
            --gold-soft: #f1d592; --gray-dark: #1e1e1e; --gray-border: #333; --text-main: #e0e0e0;
            --gold-gradient: linear-gradient(90deg, transparent, #d4af37, #f1d592, #d4af37, transparent);
        }
        body { background-color: var(--black-mate); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: 280px; background-color: var(--black-deep); border-right: 1px solid var(--gold-metalic); padding: 25px; display: flex; flex-direction: column; }
        .logo-container { text-align: center; margin-bottom: 40px; border-bottom: 1px solid var(--gray-border); padding-bottom: 20px; }
        .logo-text { font-family: 'Cinzel', serif; color: var(--gold-metalic); font-size: 26px; letter-spacing: 4px; font-weight: 700; margin-top: 10px; }
        
        .nav-btn { background: transparent; border: 1px solid transparent; color: #888; padding: 15px; text-align: left; font-family: 'Cinzel'; font-size: 12px; letter-spacing: 2px; cursor: pointer; transition: 0.3s; margin-bottom: 10px; border-radius: 8px; }
        .nav-btn:hover { color: var(--gold-soft); background: rgba(212, 175, 55, 0.05); }
        .nav-btn.active { color: var(--gold-metalic); border: 1px solid var(--gold-metalic); background: rgba(212, 175, 55, 0.1); }

        /* VISTAS */
        .view-section { display: none; flex: 1; padding: 50px; overflow-y: auto; background-image: radial-gradient(circle at center, #1a1a1a 0%, #121212 100%); }
        .view-section.active { display: block; }

        .btn-gold { background: linear-gradient(45deg, #d4af37, #f1d592); color: #000; border: none; padding: 14px 28px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Cinzel'; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; transition: 0.3s; }
        
        /* TABLAS */
        .table-container { background: rgba(0,0,0,0.6); padding: 30px; border-radius: 20px; border: 1px solid #333; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; }
        thead { border-bottom: 2px solid var(--gold-metalic); }
        th { text-align: left; color: var(--gold-soft); font-size: 11px; text-transform: uppercase; padding: 15px; }
        td { padding: 15px; border-bottom: 1px solid #222; font-size: 14px; }

        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .modal-content { background: var(--black-deep); border: 2px solid var(--gold-metalic); padding: 30px 60px; border-radius: 30px; width: 1350px; max-height: 96vh; overflow-y: auto; box-shadow: 0 0 60px rgba(0,0,0,1); }
        .gold-divider { height: 2px; background: var(--gold-gradient); border: none; margin: 15px 0; opacity: 0.8; }
        .modal-title { font-family: 'Cinzel', serif; color: var(--gold-metalic); text-align: center; font-size: 24px; letter-spacing: 3px; margin: 0; }

        /* FORMULARIOS */
        .form-section { background: rgba(255,255,255,0.02); padding: 25px 35px; border-radius: 20px; border: 1px solid #222; margin-bottom: 20px; }
        label { display: block; font-size: 12px; color: var(--gold-soft); margin-bottom: 8px; text-transform: uppercase; font-weight: 700; letter-spacing: 1.2px; }
        input, select { width: 100%; background: #000; border: 1px solid var(--gray-border); color: #fff; padding: 14px; border-radius: 10px; font-size: 15px; box-sizing: border-box; }
        
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .phone-row { display: grid; grid-template-columns: 2fr 1fr 40px; gap: 10px; margin-bottom: 10px; align-items: center; }

        .btn-add-small { background: transparent; border: 1px dashed var(--gold-metalic); color: var(--gold-metalic); padding: 8px; border-radius: 5px; cursor: pointer; font-size: 10px; text-transform: uppercase; margin-top: 5px; width: 100%; }
        .btn-cancel { background: transparent; color: #666; border: 1px solid #333; padding: 10px 25px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin: 20px auto 0; display: block; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-container">
            <div class="logo-text">ORBIS</div>
            <div style="font-size: 9px; color: var(--gold-soft); letter-spacing: 2px;">BRAIN NETWORK</div>
        </div>
        <button class="nav-btn active" onclick="showView('certificacion', this)">🏛️ Certificaciones</button>
        <button class="nav-btn" onclick="showView('directorio', this)">👥 Directorio Aliados</button>
    </div>

    <div id="view-certificacion" class="view-section active">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;">
            <h1 style="font-family:'Cinzel'; font-size: 28px;">CERTIFICACIÓN <span style="color:var(--gold-metalic)">GLOBAL</span></h1>
            <button class="btn-gold">Nueva Orquestación +</button>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>ID</th><th>Aliado</th><th>Detalle</th><th>Total</th><th>Estado</th></tr>
                </thead>
                <tbody id="cuerpo-tabla"></tbody>
            </table>
        </div>
    </div>

    <div id="view-directorio" class="view-section">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;">
            <h1 style="font-family:'Cinzel'; font-size: 28px;">DIRECTORIO <span style="color:var(--gold-metalic)">ALIADOS</span></h1>
            <button class="btn-gold" onclick="openModal('provModal')">Registrar Proveedor +</button>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>Categoría</th><th>Nombre</th><th>RIF</th><th>Contacto</th><th>Estado</th></tr>
                </thead>
                <tbody id="cuerpo-tabla-prov"></tbody>
            </table>
        </div>
    </div>

    <div id="provModal" class="modal">
        <div class="modal-content">
            <hr class="gold-divider">
            <div class="modal-title">FICHA TÉCNICA DE PROVEEDOR / ALIADO</div>
            <hr class="gold-divider">
            
            <div class="form-section">
                <div class="grid-3">
                    <div>
                        <label>Categoría de Servicio *</label>
                        <select id="prov_cat">
                            <option value="Hotel">🏨 Hotel / Alojamiento</option>
                            <option value="Agencia">🏢 Agencia de Viajes</option>
                            <option value="Freelancer">👨‍💻 Freelancer / Guía</option>
                            <option value="Traslado">🚐 Transporte / Traslado</option>
                        </select>
                    </div>
                    <div><label>Nombre Legal / Razón Social *</label><input type="text" id="prov_nombre"></div>
                    <div><label>RIF / TAX ID / Fiscal ID *</label><input type="text" id="prov_rif"></div>
                </div>
                
                <div class="grid-3" style="margin-top:20px;">
                    <div><label>País de Operación *</label><input type="text" id="prov_pais"></div>
                    <div><label>Moneda Predeterminada *</label>
                        <select id="prov_moneda">
                            <option value="$">Dólares ($)</option>
                            <option value="Bs.">Bolívares (Bs.)</option>
                        </select>
                    </div>
                    <div><label>Correo Electrónico</label><input type="email" id="prov_email"></div>
                </div>

                <div class="gold-divider" style="margin: 30px 0 20px 0; height: 1px;"></div>

                <div style="display:grid; grid-template-columns: 1.5fr 1fr; gap:30px;">
                    <div>
                        <label>Números de Teléfono de Contacto *</label>
                        <div id="phone-container">
                            <div class="phone-row">
                                <input type="text" class="prov-phone" placeholder="+00 000 0000000">
                                <select class="is-whatsapp">
                                    <option value="no">📞 Solo Llamada</option>
                                    <option value="yes">🟢 WhatsApp</option>
                                </select>
                                <div></div>
                            </div>
                            <div class="phone-row">
                                <input type="text" class="prov-phone" placeholder="Segundo número (opcional)">
                                <select class="is-whatsapp">
                                    <option value="no">📞 Solo Llamada</option>
                                    <option value="yes" selected>🟢 WhatsApp</option>
                                </select>
                                <div></div>
                            </div>
                        </div>
                        <button class="btn-add-small" onclick="addPhoneField()">+ Agregar otro número de contacto</button>
                    </div>
                    
                    <div style="background: rgba(212, 175, 55, 0.05); padding: 15px; border-radius: 10px; border: 1px solid rgba(212, 175, 55, 0.2);">
                        <p style="font-size: 11px; color: var(--gold-soft); margin: 0; line-height: 1.5;">
                            💡 <b>Nota de Orquestación:</b> Distinguir los números con WhatsApp permite una comunicación más ágil entre los aliados de la red ORBIS BRAIN.
                        </p>
                    </div>
                </div>
            </div>

            <button class="btn-gold" style="width:100%;" onclick="guardarProv()">REGISTRAR EN DIRECTORIO MAESTRO</button>
            <button class="btn-cancel" onclick="closeModal('provModal')">CANCELAR REGISTRO</button>
        </div>
    </div>

    <script>
        function showView(viewId, btn) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            btn.classList.add('active');
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function addPhoneField() {
            const container = document.getElementById('phone-container');
            const div = document.createElement('div');
            div.className = 'phone-row';
            div.innerHTML = `
                <input type="text" class="prov-phone" placeholder="Número adicional">
                <select class="is-whatsapp">
                    <option value="no">📞 Solo Llamada</option>
                    <option value="yes">🟢 WhatsApp</option>
                </select>
                <button onclick="this.parentElement.remove()" style="background:none; border:none; color:#d9534f; cursor:pointer; font-weight:bold;">X</button>
            `;
            container.appendChild(div);
        }

        function guardarProv() {
            const nombre = document.getElementById('prov_nombre').value;
            const rif = document.getElementById('prov_rif').value;
            if(!nombre || !rif) return alert("⚠️ Razón Social y RIF son obligatorios.");
            
            // Lógica de guardado visual
            const tbody = document.getElementById('cuerpo-tabla-prov');
            const cat = document.getElementById('prov_cat').value;
            const pais = document.getElementById('prov_pais').value;
            
            tbody.innerHTML += `<tr>
                <td>${cat}</td>
                <td style="font-weight:bold;">${nombre}</td>
                <td>${rif}</td>
                <td style="font-size:11px;">${pais}</td>
                <td><span style="color:#d4af37; font-size:10px; border:1px solid #d4af37; padding:2px 5px; border-radius:4px;">CERTIFICADO</span></td>
            </tr>`;
            
            alert("✅ Proveedor orquestado exitosamente en el Directorio.");
            closeModal('provModal');
        }

        window.onclick = function(event) {
            if (event.target.className === 'modal') { event.target.style.display = "none"; }
        }
    </script>
</body>
</html>
