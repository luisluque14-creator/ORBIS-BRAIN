<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBIS BRAIN | Master v9.6</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- ESTILOS UNIFICADOS RAIZ Y GLOBALES (v9.6) --- */
        :root {
            --black-mate: #121212; --black-deep: #0a0a0a; --gold-metalic: #d4af37;
            --gold-soft: #f1d592; --gray-dark: #1e1e1e; --gray-border: #333; --text-main: #e0e0e0;
            --gold-gradient: linear-gradient(90deg, transparent, #d4af37, #f1d592, #d4af37, transparent);
            --red-error: #d9534f;
        }
        body { background-color: var(--black-mate); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* ... (Estilos del Sidebar, Vistas, Botones, Tablas, etc. sin cambios) ... */
        .sidebar { width: 280px; background-color: var(--black-deep); border-right: 1px solid var(--gold-metalic); padding: 25px; display: flex; flex-direction: column; z-index: 1000; }
        .logo-container { text-align: center; margin-bottom: 40px; border-bottom: 1px solid var(--gray-border); padding-bottom: 20px; }
        .logo-text { font-family: 'Cinzel', serif; color: var(--gold-metalic); font-size: 26px; letter-spacing: 4px; font-weight: 700; margin-top: 10px; }
        .nav-btn { background: transparent; border: 1px solid transparent; color: #888; padding: 15px; text-align: left; font-family: 'Cinzel'; font-size: 12px; letter-spacing: 2px; cursor: pointer; transition: 0.3s; margin-bottom: 10px; border-radius: 8px; width: 100%; }
        .nav-btn.active { color: var(--gold-metalic); border: 1px solid var(--gold-metalic); background: rgba(212, 175, 55, 0.1); }
        .view-section { display: none; flex: 1; height: 100vh; overflow-y: auto; background-image: radial-gradient(circle at center, #1a1a1a 0%, #121212 100%); padding: 50px; }
        .view-section.active { display: block; }
        .btn-gold { background: linear-gradient(45deg, #d4af37, #f1d592); color: #000; border: none; padding: 14px 28px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Cinzel'; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; transition: 0.3s; }
        .table-container { background: rgba(0,0,0,0.6); padding: 30px; border-radius: 20px; border: 1px solid #333; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; }
        thead { border-bottom: 2px solid var(--gold-metalic); }
        th { text-align: left; color: var(--gold-soft); font-size: 11px; text-transform: uppercase; padding: 15px; letter-spacing: 1px; }
        td { padding: 15px; border-bottom: 1px solid #222; font-size: 13px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .modal-content { background: var(--black-deep); border: 2px solid var(--gold-metalic); padding: 30px 60px; border-radius: 30px; max-height: 96vh; overflow-y: auto; }
        .gold-divider { height: 2px; background: var(--gold-gradient); border: none; margin: 15px 0; opacity: 0.8; }
        .modal-title { font-family: 'Cinzel', serif; color: var(--gold-metalic); text-align: center; font-size: 24px; letter-spacing: 3px; margin: 0; }
        .form-section { background: rgba(255,255,255,0.02); padding: 20px 30px; border-radius: 20px; border: 1px solid #222; margin-bottom: 15px; }
        label { display: block; font-size: 12.5px; color: var(--gold-soft); margin-bottom: 8px; text-transform: uppercase; font-weight: 700; letter-spacing: 1.2px; }
        input, select { width: 100%; background: #000; border: 1px solid var(--gray-border); color: #fff; padding: 14px; border-radius: 10px; font-size: 15px; box-sizing: border-box; transition: border-color 0.3s; }
        input[readonly] { background: #111; color: #777; cursor: not-allowed; }
        .input-error { border-color: var(--red-error) !important; }
        .btn-cancel-elite { background: transparent; color: #666; border: 1px solid #333; padding: 10px 25px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin: 20px auto 0; display: block; transition: 0.4s; }
        .btn-cancel-elite:hover { color: #d9534f; border-color: #d9534f; background: rgba(217, 83, 79, 0.05); }
        .btn-remove { background: none; color: #d9534f; border: 1px solid #d9534f; border-radius: 8px; cursor: pointer; height: 46px; width: 100%; display: flex; align-items: center; justify-content: center; }
        .btn-add { background: none; border: 1px dashed var(--gold-metalic); color: var(--gold-metalic); width: 100%; padding: 10px; cursor: pointer; border-radius: 8px; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-top: 10px; }
        #opModal .modal-content { width: 1350px; }
        .grid-inputs { display: grid; grid-template-columns: 1.2fr 2fr 1fr 1fr 40px; gap: 12px; margin-bottom: 12px; align-items: end; }
        
        /* --- INYECCIÓN DE LÓGICA v9.6: Restauración de diseño de lujo --- */
        .summary-box { 
            background: #000; padding: 25px 35px; border-radius: 20px; 
            border: 1px solid var(--gold-metalic); 
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.2);
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-top: 20px; 
        }
        .sum-item { text-align: center; border-right: 1px solid #222; padding: 0 5px; } 
        .sum-item:last-child { border-right: none; }
        .sum-val { display: block; font-size: 20px; font-weight: 800; color: var(--gold-soft); margin-bottom: 5px; }
        .sum-lbl { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; }
        #res-ganancia, #res-total { color: var(--gold-metalic) !important; }

        #provModal .modal-content { width: 1200px; padding: 25px 60px; }
        #provModal input, #provModal select { text-transform: uppercase; }
        .dynamic-row { display: grid; grid-template-columns: 2fr 1fr 40px; gap: 10px; margin-bottom: 10px; }
        .btn-add-small { background: transparent; border: 1px dashed var(--gold-metalic); color: var(--gold-metalic); padding: 8px; border-radius: 5px; cursor: pointer; font-size: 10px; text-transform: uppercase; width: 100%; margin-bottom: 15px; }
        .warning-box { background: rgba(217, 83, 79, 0.1); border: 1px solid #d9534f; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; }
        
        /* Verificación de limpieza v9.6 */
        #aliado_name, #aliado_rif { text-transform: uppercase; }
        .tax-input::-webkit-inner-spin-button, .tax-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .tax-input { -moz-appearance: textfield; }
        .pin-btn { background: none; border: none; font-size: 18px; cursor: pointer; transition: opacity 0.3s; opacity: 0.3; }
        .pin-btn.active { opacity: 1; }
    </style>
</head>
<body>
    <!-- ESTRUCTURA HTML SIN CAMBIOS (SIDEBAR, VISTAS, MODALES) -->
    <div class="sidebar">
        <div class="logo-container"><div class="logo-text">ORBIS</div><div style="font-size: 9px; color: var(--gold-soft); letter-spacing: 2px;">BRAIN NETWORK</div></div>
        <button id="nav-certificacion" class="nav-btn active" onclick="showView('certificacion', this)">🏛️ Certificaciones</button>
        <button id="nav-directorio" class="nav-btn" onclick="showView('directorio', this)">👥 Directorio Maestro</button>
    </div>
    <div id="view-certificacion" class="view-section active">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;"><h1 style="font-family:'Cinzel'; font-size: 28px; margin:0;">CERTIFICACIÓN <span style="color:var(--gold-metalic)">GLOBAL</span></h1><button class="btn-gold" onclick="openModal('opModal')">Nueva Orquestación +</button></div>
        <div class="table-container"><table><thead><tr><th style="padding:15px;">ID Operación</th><th>Aliado Responsable</th><th>Fecha</th><th>Total Certificado</th><th>Estado</th></tr></thead><tbody id="cuerpo-tabla-cert"></tbody></table></div>
    </div>
    <div id="view-directorio" class="view-section">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;"><h1 style="font-family:'Cinzel'; font-size: 26px; margin:0;">DIRECTORIO <span style="color:var(--gold-metalic)">GLOBAL</span></h1><button class="btn-gold" style="width:auto;" onclick="openModal('provModal')">Cargar Ficha Técnica +</button></div>
        <div class="table-container"><table><thead><tr><th>Categoría</th><th>Nombre Legal</th><th>RIF / Tax ID</th><th>País</th><th>Acción</th></tr></thead><tbody id="cuerpo-tabla-prov"></tbody></table></div>
    </div>
    <div id="opModal" class="modal">
        <div class="modal-content">
            <hr class="gold-divider"><div class="modal-title">REGISTRO DE CERTIFICACIÓN FISCAL</div><hr class="gold-divider">
            <form id="registroForm">
                <div class="form-section">
                    <div style="display:grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap:15px;">
                        <div><label>Nombre Fiscal del Aliado *</label><input type="text" id="aliado_name" placeholder="Nombre Legal"></div>
                        <div><label>RIF / Tax ID *</label><input type="text" id="aliado_rif" placeholder="ID Tributario"></div>
                        <div><label>Moneda Orquestación *</label><select id="moneda_global" onchange="cambiarMoneda()"><option value="$">USD ($)</option><option value="Bs.">Bs. (VE)</option><option value="€">EUR (€)</option><option value="د.إ">AED (د.إ)</option></select></div>
                        <div><label style="color:var(--gold-metalic)">Honorarios Aliado (<span class="curr-sym">$</span>)</label><input type="number" id="comision_aliado" readonly style="background: #111; color: var(--gold-metalic); font-weight: bold;"></div>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1.8fr 1fr; gap: 20px; margin-top: 15px;">
                    <div class="form-section">
                        <label>Bases Imponibles & Comisiones (<span class="curr-sym">$</span>)</label>
                        <div id="contenedor-servicios">
                            <div id="cobertura-row" class="grid-inputs row-fixed">
                                <div><label>Cobertura</label><select id="tipo_cobertura_sel"><option value="interno">🛡️ ORBIS PROTECT</option><option value="externo">✍️ SEGURO EXTERNO / MANUAL</option></select></div>
                                <div><label>Aseguradora</label><input type="text" id="cobertura_aseguradora" value="ORBIS BRAIN NETWORK" readonly></div>
                                <div><label>Base *</label><input type="number" id="cobertura_base" value="2.00" readonly></div>
                                <div><label>Comisión *</label><input type="number" id="cobertura_comision" value="0.00" readonly></div>
                                <div id="cobertura_icon" style="display:flex; align-items:center; justify-content:center; color:var(--gold-metalic);">🔒</div>
                            </div>
                            <div id="filas-dinamicas" style="margin-top:10px;"></div>
                        </div>
                        <button type="button" class="btn-add" onclick="agregarFila()">+ AGREGAR PROVEEDOR</button>
                    </div>
                    <div class="form-section">
                        <label style="color:var(--gold-metalic)">Tasas e Impuestos (%)</label>
                        <div id="contenedor-taxes"></div>
                        <datalist id="sugerencias_impuestos"></datalist>
                        <button type="button" class="btn-add" onclick="agregarTax()">+ AGREGAR TASA</button>
                    </div>
                </div>
            </form>
            <div class="summary-box">
                <div class="sum-item"><span class="sum-lbl">Base Imponible</span><span id="res-neto" class="sum-val">0.00 <span class="curr-sym">$</span></span></div>
                <div class="sum-item"><span class="sum-lbl">Impuestos</span><span id="res-imp" class="sum-val">0.00 <span class="curr-sym">$</span></span></div>
                <div class="sum-item"><span class="sum-lbl">Fee Orbis</span><span id="res-fee-fijo" class="sum-val">6.00 <span class="curr-sym">$</span></span></div>
                <div class="sum-item"><span class="sum-lbl">Escudo Oro</span><span id="res-escudo" class="sum-val">0.00 <span class="curr-sym">$</span></span></div>
                <div class="sum-item"><span class="sum-lbl">GANANCIA</span><span id="res-ganancia" class="sum-val">0.00 <span class="curr-sym">$</span></span></div>
                <div class="sum-item"><span class="sum-lbl">TOTAL</span><span id="res-total" class="sum-val">0.00 <span class="curr-sym">$</span></span></div>
            </div>
            <button class="btn-gold" style="width:100%; margin-top:20px;" onclick="confirmarRegistro()">VALIDAR Y SINCRONIZAR</button>
            <button class="btn-cancel-elite" onclick="closeModal('opModal')">Cancelar</button>
        </div>
    </div>
    <!-- (El resto del HTML sigue igual) -->

    <!-- ======================================================================= -->
    <!--                         JAVASCRIPT UNIFICADO (v9.6)                     -->
    <!-- ======================================================================= -->
    <script>
        // --- INYECCIÓN DE LÓGICA v9.6: URL de producción ---
        const URL_SCRIPT_CERT = "https://script.google.com/macros/s/AKfycbxF-mbAYdkaxaEvwO_tEH1KjaChodlf-kAdstdqRkZb80yMGRgF7X7MZTgn6yVqJCK9iw/exec"; 
        
        const TASAS = { "$": 1.00, "Bs.": 45.00, "€": 0.93, "د.إ": 3.67 };
        const SUGERENCIAS = { "$": ["Sales Tax", "Federal Tax"], "Bs.": ["IVA 16%", "IGTF 3%"], "€": ["VAT (IVA)"], "د.إ": ["VAT 5%"] };
        const FEE_ORBIS_BASE = 5.00; 
        const FEE_ORBIS_PROTECT = 1.00;

        function openModal(id) {
            const modal = document.getElementById(id);
            modal.style.display = 'flex';
            if (id === 'opModal') {
                document.getElementById('registroForm').reset();
                document.getElementById('filas-dinamicas').innerHTML = '';
                document.getElementById('contenedor-taxes').innerHTML = '';
                cambiarMoneda(); 
                gestionarEstadoCobertura(true); 
                agregarFila();
                cargarImpuestosPredeterminados();
                if (document.getElementById('contenedor-taxes').children.length === 0) {
                    agregarTax();
                }
            } else if (id === 'provModal') { resetFichaDirectorio(); }
        }

        function obtenerImpuestosGuardados() { return JSON.parse(localStorage.getItem('orbis_impuestos_predeterminados')) || []; }
        function guardarImpuestos(impuestos) { localStorage.setItem('orbis_impuestos_predeterminados', JSON.stringify(impuestos)); }
        function cargarImpuestosPredeterminados() { const impuestosGuardados = obtenerImpuestosGuardados(); impuestosGuardados.forEach(imp => agregarTax(imp.nombre, imp.valor, true)); }
        
        function gestionarPin(btn) {
            const fila = btn.closest('.tax-row');
            const nombre = fila.querySelector('.tax-name').value;
            const valor = fila.querySelector('.tax-val').value;
            if (!nombre || !valor) { alert('Debe especificar un nombre y un valor para fijar el impuesto.'); return; }
            let impuestosGuardados = obtenerImpuestosGuardados();
            const indice = impuestosGuardados.findIndex(imp => imp.nombre.toLowerCase() === nombre.toLowerCase());
            if (indice > -1) { impuestosGuardados.splice(indice, 1); btn.classList.remove('active'); } 
            else { impuestosGuardados.push({ nombre, valor }); btn.classList.add('active'); }
            guardarImpuestos(impuestosGuardados);
        }

        function agregarTax(nombre = '', valor = '', esPredeterminado = false) {
            const div = document.createElement('div');
            div.className = 'tax-grid tax-row';
            // Verificación de limpieza v9.6: Estructura del input de impuesto con % pegado
            div.style.display = 'grid'; div.style.gridTemplateColumns = '30px 2fr 1fr 40px'; div.style.gap = '12px'; div.style.marginBottom = '12px';
            const pinActivoClass = esPredeterminado ? 'active' : '';
            div.innerHTML = `
                <button type="button" class="pin-btn ${pinActivoClass}" onclick="gestionarPin(this)">📌</button>
                <div><input type="text" class="tax-name" placeholder="Impuesto *" list="sugerencias_impuestos" value="${nombre}"></div>
                <div style="position:relative;">
                    <input type="number" class="tax-val tax-input" oninput="calcularTodo()" placeholder="0.00" value="${valor}">
                    <span style="position:absolute; right:15px; top: 50%; transform: translateY(-50%); color:var(--gold-soft); font-weight:bold;">%</span>
                </div>
                <button type="button" class="btn-remove" onclick="eliminarFilaImpuesto(this)">X</button>`;
            document.getElementById('contenedor-taxes').appendChild(div);
            calcularTodo();
        }

        function eliminarFilaImpuesto(btn) {
            const fila = btn.closest('.tax-row');
            const nombre = fila.querySelector('.tax-name').value;
            const esFijado = fila.querySelector('.pin-btn').classList.contains('active');
            if (nombre && esFijado) {
                let impuestosGuardados = obtenerImpuestosGuardados();
                const impuestosActualizados = impuestosGuardados.filter(imp => imp.nombre.toLowerCase() !== nombre.toLowerCase());
                guardarImpuestos(impuestosActualizados);
            }
            fila.remove();
            calcularTodo();
        }

        function confirmarRegistro() {
            // ... (Validaciones de v9.3 sin cambios) ...
            if (confirm("🏛️ ¿Confirma la sincronización de esta certificación? Los datos NO podrán ser editados ni eliminados una vez registrados en ORBIS BRAIN NETWORK.")) {
                enviarAlCerebro();
            }
        }

        function enviarAlCerebro() {
            const btnSync = document.querySelector('.btn-gold');
            btnSync.disabled = true;
            btnSync.textContent = 'SINCRONIZANDO...';
            // Recolección de datos mejorada para el script
            const datos = {
                idOperacion: `CERT-${Math.floor(10000 + Math.random() * 90000)}`,
                aliado: document.getElementById('aliado_name').value,
                rif: document.getElementById('aliado_rif').value,
                moneda: document.getElementById('moneda_global').value,
                totalCertificado: document.getElementById('res-total').textContent,
                ganancia: document.getElementById('res-ganancia').textContent,
                fecha: new Date().toISOString()
            };

            fetch(URL_SCRIPT_CERT, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({action: 'registrarCertificacion', data: datos})
            })
            .then(res => {
                alert("✅ SINCRONIZACIÓN EXITOSA: La certificación ha sido registrada en ORBIS BRAIN NETWORK.");
                const tbody = document.getElementById('cuerpo-tabla-cert');
                const newRow = tbody.insertRow(0);
                newRow.innerHTML = `
                    <td>${datos.idOperacion}</td>
                    <td>${datos.aliado}</td>
                    <td>${new Date(datos.fecha).toLocaleDateString()}</td>
                    <td>${datos.totalCertificado}</td>
                    <td><span style="color:#4CAF50">REGISTRADO</span></td>
                `;
                closeModal('opModal');
            })
            .catch(error => {
                console.error('Error de sincronización:', error);
                alert("🔴 ERROR CRÍTICO: No se pudo sincronizar con ORBIS BRAIN NETWORK. Verifique la conexión y la URL del script.");
            })
            .finally(() => {
                btnSync.disabled = false;
                btnSync.textContent = 'VALIDAR Y SINCRONIZAR';
            });
        }
        
        // ... (El resto del JS sigue aquí sin cambios, he omitido las funciones repetidas por brevedad) ...
        function showView(viewId, btn) { document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active')); document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); document.getElementById('view-' + viewId).classList.add('active'); if (btn) btn.classList.add('active'); }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        // Verificación de limpieza v9.6: event listeners de mayúsculas
        document.getElementById('aliado_name').addEventListener('input', function() { this.value = this.value.toUpperCase(); });
        document.getElementById('aliado_rif').addEventListener('input', function() { this.value = this.value.toUpperCase(); });
        document.getElementById('tipo_cobertura_sel').addEventListener('change', function() { gestionarEstadoCobertura(this.value === 'interno'); });
        function gestionarEstadoCobertura(esInterno) { const aseguradora = document.getElementById('cobertura_aseguradora'); const base = document.getElementById('cobertura_base'); const comision = document.getElementById('cobertura_comision'); const icon = document.getElementById('cobertura_icon'); if (esInterno) { aseguradora.value = 'ORBIS BRAIN NETWORK'; base.value = '2.00'; comision.value = '0.00'; icon.innerHTML = '🔒'; [aseguradora, base, comision].forEach(el => el.setAttribute('readonly', true)); } else { aseguradora.value = ''; base.value = '0.00'; comision.value = '0.00'; icon.innerHTML = '✍️'; aseguradora.placeholder = 'Nombre Aseguradora'; [aseguradora, base, comision].forEach(el => el.removeAttribute('readonly')); } calcularTodo(); }
        function cambiarMoneda() { const sym = document.getElementById('moneda_global').value; document.querySelectorAll('.curr-sym').forEach(el => el.innerText = sym); const dl = document.getElementById('sugerencias_impuestos'); dl.innerHTML = ""; if (SUGERENCIAS[sym]) { SUGERENCIAS[sym].forEach(s => { const opt = document.createElement('option'); opt.value = s; dl.appendChild(opt); }); } calcularTodo(); }
        function agregarFila() { const div = document.createElement('div'); div.className = 'grid-inputs servicio-row'; div.innerHTML = `<div><select class="tipo-srv" onchange="calcularTodo()"><option value="Hotel">🏨 Hotel</option><option value="Vuelo">✈️ Vuelo</option><option value="Traslado">🚐 Traslado</option><option value="Otro">➕ Otro</option></select></div><div><input type="text" class="prov-name" placeholder="Proveedor *"></div><div><input type="number" class="monto-srv" oninput="calcularTodo()" placeholder="0.00"></div><div><input type="number" class="comision-ind" oninput="calcularTodo()" placeholder="0.00"></div><button type="button" class="btn-remove" onclick="this.parentElement.remove(); calcularTodo();">X</button>`; document.getElementById('filas-dinamicas').appendChild(div); }
        function calcularTodo() { const sym = document.getElementById('moneda_global').value; const tasaCambio = TASAS[sym] || 1.00; const esSeguroInterno = document.getElementById('tipo_cobertura_sel').value === 'interno'; let totalBaseServicios = 0; let totalComisiones = 0; totalBaseServicios += parseFloat(document.getElementById('cobertura_base').value) || 0; totalComisiones += parseFloat(document.getElementById('cobertura_comision').value) || 0; document.querySelectorAll('.servicio-row').forEach(row => { totalBaseServicios += parseFloat(row.querySelector('.monto-srv').value) || 0; totalComisiones += parseFloat(row.querySelector('.comision-ind').value) || 0; }); document.getElementById('comision_aliado').value = totalComisiones.toFixed(2); const baseImponibleTotal = totalBaseServicios + totalComisiones; let totalImpuestos = 0; document.querySelectorAll('.tax-row').forEach(row => { const porcentaje = parseFloat(row.querySelector('.tax-val').value) || 0; if (porcentaje > 0) totalImpuestos += baseImponibleTotal * (porcentaje / 100); }); let feeOrbisLocal = FEE_ORBIS_BASE; if (esSeguroInterno) { feeOrbisLocal += FEE_ORBIS_PROTECT; } const feeOrbisFinal = feeOrbisLocal * tasaCambio; let impuestosSobreComision = 0; document.querySelectorAll('.tax-row').forEach(row => { const porcentaje = parseFloat(row.querySelector('.tax-val').value) || 0; if (porcentaje > 0) impuestosSobreComision += totalComisiones * (porcentaje / 100); }); const gananciaNeta = totalComisiones - impuestosSobreComision; const subTotal = baseImponibleTotal + totalImpuestos + feeOrbisFinal; const escudoOro = subTotal * 0.005; const totalFinal = subTotal + escudoOro; document.getElementById('res-neto').innerHTML = `${baseImponibleTotal.toFixed(2)} <span class="curr-sym">${sym}</span>`; document.getElementById('res-imp').innerHTML = `${totalImpuestos.toFixed(2)} <span class="curr-sym">${sym}</span>`; document.getElementById('res-fee-fijo').innerHTML = `${feeOrbisFinal.toFixed(2)} <span class="curr-sym">${sym}</span>`; document.getElementById('res-escudo').innerHTML = `${escudoOro.toFixed(2)} <span class="curr-sym">${sym}</span>`; document.getElementById('res-ganancia').innerHTML = `${gananciaNeta.toFixed(2)} <span class="curr-sym">${sym}</span>`; document.getElementById('res-total').innerHTML = `${totalFinal.toFixed(2)} <span class="curr-sym">${sym}</span>`; }
    </script>
