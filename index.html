<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBIS BRAIN | Master Dashboard v8.5</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- ESTILOS RAIZ Y SIDEBAR (SAGRADOS) --- */
        :root {
            --black-mate: #121212; --black-deep: #0a0a0a; --gold-metalic: #d4af37;
            --gold-soft: #f1d592; --gray-dark: #1e1e1e; --gray-border: #333; --text-main: #e0e0e0;
            --gold-gradient: linear-gradient(90deg, transparent, #d4af37, #f1d592, #d4af37, transparent);
        }
        body { background-color: var(--black-mate); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background-color: var(--black-deep); border-right: 1px solid var(--gold-metalic); padding: 25px; display: flex; flex-direction: column; z-index: 1000; }
        .logo-container { text-align: center; margin-bottom: 40px; border-bottom: 1px solid var(--gray-border); padding-bottom: 20px; }
        .logo-text { font-family: 'Cinzel', serif; color: var(--gold-metalic); font-size: 26px; letter-spacing: 4px; font-weight: 700; margin-top: 10px; }
        .nav-btn { background: transparent; border: 1px solid transparent; color: #888; padding: 15px; text-align: left; font-family: 'Cinzel'; font-size: 12px; letter-spacing: 2px; cursor: pointer; transition: 0.3s; margin-bottom: 10px; border-radius: 8px; width: 100%; }
        .nav-btn.active { color: var(--gold-metalic); border: 1px solid var(--gold-metalic); background: rgba(212, 175, 55, 0.1); }
        .view-section { display: none; flex: 1; height: 100vh; overflow-y: auto; background-image: radial-gradient(circle at center, #1a1a1a 0%, #121212 100%); }
        .view-section.active { display: block; }
    </style><style>
        .btn-gold { background: linear-gradient(45deg, #d4af37, #f1d592); color: #000; border: none; padding: 14px 28px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Cinzel'; text-transform: uppercase; font-size: 13px; letter-spacing: 1px; transition: 0.3s; }
        .table-container { background: rgba(0,0,0,0.6); padding: 30px; border-radius: 20px; border: 1px solid #333; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; }
        thead { border-bottom: 2px solid var(--gold-metalic); }
        th { text-align: left; color: var(--gold-soft); font-size: 11px; text-transform: uppercase; padding: 15px; letter-spacing: 1px; }
        td { padding: 15px; border-bottom: 1px solid #222; font-size: 13px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .modal-content { background: var(--black-deep); border: 2px solid var(--gold-metalic); padding: 30px 60px; border-radius: 30px; width: 1350px; max-height: 96vh; overflow-y: auto; }
        .gold-divider { height: 2px; background: var(--gold-gradient); border: none; margin: 15px 0; opacity: 0.8; }
        .modal-title { font-family: 'Cinzel', serif; color: var(--gold-metalic); text-align: center; font-size: 24px; letter-spacing: 3px; margin: 0; }

        .form-section { background: rgba(255,255,255,0.02); padding: 20px 30px; border-radius: 20px; border: 1px solid #222; margin-bottom: 15px; }
        label { display: block; font-size: 12.5px; color: var(--gold-soft); margin-bottom: 8px; text-transform: uppercase; font-weight: 700; letter-spacing: 1.2px; }
        input, select { width: 100%; background: #000; border: 1px solid var(--gray-border); color: #fff; padding: 14px; border-radius: 10px; font-size: 15px; box-sizing: border-box; }
        
        .grid-inputs { display: grid; grid-template-columns: 1.2fr 2fr 1fr 1fr 40px; gap: 12px; margin-bottom: 12px; align-items: end; }
        .row-fixed { background: rgba(212, 175, 55, 0.05); border-radius: 10px; padding: 5px; border: 1px solid rgba(212, 175, 55, 0.2); }

        .summary-box { background: #000; padding: 25px 35px; border-radius: 20px; border: 1px solid var(--gold-metalic); display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-top: 20px; }
        .sum-item { text-align: center; border-right: 1px solid #222; padding: 0 5px; }
        .sum-item:last-child { border-right: none; }
        .sum-val { display: block; font-size: 20px; font-weight: 800; color: var(--gold-metalic); margin-bottom: 5px; }
        .sum-lbl { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; }

        .btn-cancel-elite { background: transparent; color: #666; border: 1px solid #333; padding: 10px 25px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin: 20px auto 0; display: block; transition: 0.4s; }
        .btn-cancel-elite:hover { color: #d9534f; border-color: #d9534f; background: rgba(217, 83, 79, 0.05); }
        .btn-remove { background: none; color: #d9534f; border: 1px solid #d9534f; border-radius: 8px; cursor: pointer; height: 46px; width: 100%; display: flex; align-items: center; justify-content: center; }
        .btn-add { background: none; border: 1px dashed var(--gold-metalic); color: var(--gold-metalic); width: 100%; padding: 10px; cursor: pointer; border-radius: 8px; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-top: 10px; }
    </style>
    
    </head>
<body>

    <script>
        const USUARIO_ACTUAL = "LUIS_ALFREDO";
        const TASAS = { "$": 1.00, "Bs.": 45.00, "€": 0.93, "د.إ": 3.67 };
    </script>

    <div class="sidebar">
        <div class="logo-container">
            <div class="logo-text">ORBIS</div>
            <div style="font-size: 9px; color: var(--gold-soft); letter-spacing: 2px;">BRAIN NETWORK</div>
        </div>
        <button class="nav-btn active" onclick="showView('certificacion', this)">🏛️ Certificaciones</button>
        <button class="nav-btn" onclick="showView('directorio', this)">👥 Directorio Maestro</button>
    </div>

    <div id="view-certificacion" class="view-section active">
        </div><div style="padding: 50px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px;">
                <h1 style="font-family:'Cinzel'; font-size: 28px; margin:0;">CERTIFICACIÓN <span style="color:var(--gold-metalic)">GLOBAL</span></h1>
                <button class="btn-gold" onclick="openModal('opModal')">Nueva Orquestación +</button>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="padding:15px;">ID Operación</th>
                            <th>Aliado Responsable</th>
                            <th>Detalle Fiscal</th>
                            <th>Total Certificado</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla">
                        </tbody>
                </table>
            </div>
        </div>

    <div id="view-directorio" class="view-section">
        </div>

    <script><div id="opModal" class="modal">
        <div class="modal-content">
            <hr class="gold-divider"><div class="modal-title">REGISTRO PARA CERTIFICACIÓN FISCAL Y CONTABLE</div><hr class="gold-divider">
            <form id="registroForm">
                <div class="form-section">
                    <div style="display:grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap:15px;">
                        <div><label>Nombre Fiscal del Aliado *</label><input type="text" id="aliado_name" placeholder="Nombre Legal"></div>
                        <div><label>RIF / Tax ID *</label><input type="text" id="aliado_rif" placeholder="ID Tributario"></div>
                        <div>
                            <label>Moneda Orquestación *</label>
                            <select id="moneda_global" onchange="cambiarMoneda()">
                                <option value="$">USD ($) - Dólar</option>
                                <option value="Bs.">Bs. (VE) - Bolívar</option>
                                <option value="€">EUR (€) - Euro</option>
                                <option value="د.إ">AED (د.إ) - Dirham</option>
                            </select>
                        </div>
                        <div><label style="color:var(--gold-metalic)">Honorarios Aliado (<span class="curr-sym">$</span>)</label><input type="number" id="comision_aliado" readonly style="background: #111; color: var(--gold-metalic); font-weight: bold; border-color: var(--gold-metalic);"></div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1.8fr 1fr; gap: 20px; margin-top: 15px;">
                    <div class="form-section">
                        <label>Bases Imponibles & Comisiones (<span class="curr-sym">$</span>)</label>
                        <div id="contenedor-servicios">
                            <div class="grid-inputs row-fixed">
                                <div><label>Cobertura</label><select id="tipo_seguro_sel" onchange="calcularTodo()"><option value="interno">🛡️ ORBIS PROTECT</option></select></div>
                                <div><label>Aseguradora</label><input type="text" value="ORBIS BRAIN NETWORK" readonly></div>
                                <div><label>Base *</label><input type="number" id="seguro_neto" value="2.00" readonly></div>
                                <div><label>Comisión *</label><input type="number" id="seguro_com" value="0.00" readonly></div>
                                <div style="display:flex; align-items:center; justify-content:center; color:var(--gold-metalic);">🔒</div>
                            </div>
                            <div id="filas-dinamicas" style="margin-top:10px;">
                                <div class="grid-inputs servicio-row">
                                    <div><select class="tipo-srv" onchange="calcularTodo()"><option value="Hotel">🏨 Hotel</option><option value="Vuelo">✈️ Vuelo</option></select></div>
                                    <div><input type="text" class="prov-name" placeholder="Proveedor *"></div>
                                    <div><input type="number" class="monto-srv" oninput="calcularTodo()" placeholder="0.00"></div>
                                    <div><input type="number" class="comision-ind" oninput="calcularTodo()" placeholder="0.00" style="color:var(--gold-soft)"></div>
                                    <button type="button" class="btn-remove" onclick="this.parentElement.remove(); calcularTodo();">X</button>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="btn-add" onclick="agregarFila()">+ AGREGAR OTRO PROVEEDOR</button>
                    </div>

                    <div class="form-section">
                        <label style="color:var(--gold-metalic)">Tasas e Impuestos (%)</label>
                        <div id="contenedor-taxes">
                            <div class="tax-grid tax-row">
                                <div><input type="text" class="tax-name" placeholder="Nombre Impuesto *"></div>
                                <div class="tax-input-wrapper"><input type="number" class="tax-val" oninput="calcularTodo()" placeholder="0"><span class="tax-symbol">% *</span></div>
                                <div></div>
                            </div>
                        </div>
                        <button type="button" class="btn-add" onclick="agregarTax()">+ AGREGAR TASA</button>
                    </div>
                </div>
            </form>

            <div class="summary-box">
                <div class="sum-item"><span class="sum-lbl">Base Imponible</span><span id="res-neto" class="sum-val">0.00 <span class="curr-sym">$</span></span></div>
                <div class="sum-item" style="border: 1px solid #333; border-radius: 10px;"><span class="sum-lbl">Total Impuestos</span><span id="res-imp" class="sum-val">0.00 <span class="curr-sym">$</span></span></div>
                <div class="sum-item"><span class="sum-lbl">Fee Orbis Brain</span><span id="res-fee-fijo" class="sum-val">6.00 <span class="curr-sym">$</span></span></div>
                <div class="sum-item"><span class="sum-lbl">Escudo Oro (0.5%)</span><span id="res-escudo" class="sum-val">0.00 <span class="curr-sym">$</span></span></div>
                <div class="sum-item" style="background: rgba(212, 175, 55, 0.15); border-radius: 10px;"><span class="sum-lbl">GANANCIA NETA</span><span id="res-ganancia" class="sum-val">0.00 <span class="curr-sym">$</span></span></div>
                <div class="sum-item" style="border:none;"><span class="sum-lbl" style="color:#4CAF50">TOTAL FACTURADO</span><span id="res-total" class="sum-val" style="color:#4CAF50">0.00 <span class="curr-sym">$</span></span></div>
            </div>

            <button class="btn-gold" style="width:100%; margin-top:20px; padding: 18px;" onclick="confirmarRegistro()">VALIDAR Y SINCRONIZAR CERTIFICACIÓN</button>
            <button class="btn-cancel-elite" onclick="document.getElementById('opModal').style.display='none'">Cancelar Registro</button>
        </div>
    </div>

    <div id="provModal" class="modal">
        <div class="modal-content">
            <hr class="gold-divider"><div class="modal-title">RED MAESTRA - FICHA TÉCNICA</div><hr class="gold-divider">
            <div class="form-section" style="margin-top:20px;">
                <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:20px;">
                    <div><label>Categoría *</label><select id="prov_cat"><option value="HOTEL">🏨 HOTEL</option><option value="AGENCIA">🏢 AGENCIA</option></select></div>
                    <div><label>Nombre Legal *</label><input type="text" id="prov_nombre" oninput="this.value = this.value.toUpperCase()" placeholder="NOMBRE LEGAL"></div>
                    <div><label>RIF / Tax ID *</label><input type="text" id="prov_rif" oninput="this.value = this.value.toUpperCase()" placeholder="RIF / ID"></div>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-top:20px;">
                    <div><label>País de Operación *</label><input type="text" id="prov_pais" oninput="this.value = this.value.toUpperCase()" placeholder="PAÍS"></div>
                    <div><label>Moneda Base *</label><select id="prov_moneda"><option value="USD ($)">USD ($)</option><option value="VES (Bs.)">VES (Bs.)</option></select></div>
                </div>
            </div>
            <button class="btn-gold" style="width:100%; padding: 22px; margin-top:25px;" onclick="iniciarGuardadoProv()">REGISTRAR EN RED MAESTRA</button>
            <button class="btn-cancel-elite" onclick="document.getElementById('provModal').style.display='none'">Cancelar y Salir</button>
        </div>
    </div>
        function showView(vId, btn) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('view-' + vId).classList.add('active');
            btn.classList.add('active');
        }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        
        </script>
<script>
        // MOTOR DE NAVEGACIÓN
        function showView(vId, btn) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('view-' + vId).classList.add('active');
            btn.classList.add('active');
        }

        function openModal(id) { 
            document.getElementById(id).style.display = 'flex'; 
            if(id === 'opModal') calcularTodo(); 
        }

        // --- LÓGICA DE CERTIFICACIÓN (v5.7) ---
        function cambiarMoneda() {
            const sym = document.getElementById('moneda_global').value;
            document.querySelectorAll('.curr-sym').forEach(el => el.innerText = sym);
            calcularTodo();
        }

        function agregarFila() {
            const div = document.createElement('div'); div.className = 'grid-inputs servicio-row';
            div.innerHTML = `<div><select class="tipo-srv" onchange="calcularTodo()"><option value="Hotel">🏨 Hotel</option><option value="Vuelo">✈️ Vuelo</option></select></div><div><input type="text" class="prov-name" placeholder="Proveedor *"></div><div><input type="number" class="monto-srv" oninput="calcularTodo()" placeholder="0.00"></div><div><input type="number" class="comision-ind" oninput="calcularTodo()" placeholder="0.00"></div><button type="button" class="btn-remove" onclick="this.parentElement.remove(); calcularTodo();">X</button>`;
            document.getElementById('filas-dinamicas').appendChild(div);
        }

        function agregarTax() {
            const div = document.createElement('div'); div.className = 'tax-grid tax-row';
            div.innerHTML = `<div><input type="text" class="tax-name" placeholder="Impuesto *"></div><div class="tax-input-wrapper"><input type="number" class="tax-val" oninput="calcularTodo()" placeholder="0"><span class="tax-symbol">% *</span></div><button type="button" class="btn-remove" onclick="this.parentElement.remove(); calcularTodo();">X</button>`;
            document.getElementById('contenedor-taxes').appendChild(div);
        }

        function calcularTodo() {
            const sym = document.getElementById('moneda_global').value;
            const tasa = TASAS[sym];
            let baseSrv = 2.00 * tasa; 
            let totalComAliado = 0;

            document.querySelectorAll('.servicio-row').forEach(row => {
                baseSrv += parseFloat(row.querySelector('.monto-srv').value) || 0;
                totalComAliado += parseFloat(row.querySelector('.comision-ind').value) || 0;
            });

            document.getElementById('comision_aliado').value = totalComAliado.toFixed(2);
            let feeOrbis = 6.00 * tasa;
            const baseImponible = baseSrv + totalComAliado + feeOrbis;

            let taxTotal = 0; let tasaPct = 0;
            document.querySelectorAll('.tax-row').forEach(row => {
                const p = parseFloat(row.querySelector('.tax-val').value) || 0;
                taxTotal += baseImponible * (p / 100); tasaPct += p;
            });

            const granTotal = baseImponible + taxTotal;
            document.getElementById('res-neto').innerText = baseImponible.toFixed(2) + " " + sym;
            document.getElementById('res-imp').innerText = taxTotal.toFixed(2) + " " + sym;
            document.getElementById('res-fee-fijo').innerText = feeOrbis.toFixed(2) + " " + sym;
            document.getElementById('res-escudo').innerText = (granTotal * 0.005).toFixed(2) + " " + sym;
            document.getElementById('res-ganancia').innerText = (totalComAliado * (1 - tasaPct/100)).toFixed(2) + " " + sym;
            document.getElementById('res-total').innerText = granTotal.toFixed(2) + " " + sym;
        }

        function confirmarRegistro() {
            if(confirm("🏛️ ORBIS BRAIN SECURITY:\n¿Confirma la sincronización de esta certificación?")) {
                alert("CERTIFICACIÓN SINCRONIZADA v5.7");
                location.reload();
            }
        }

        // --- LÓGICA DE DIRECTORIO (v6.12) ---
        function iniciarGuardadoProv() {
            const n = document.getElementById('prov_nombre').value;
            const r = document.getElementById('prov_rif').value;
            const p = document.getElementById('prov_pais').value;
            if(!n || !r || !p) return alert("⚠️ ERROR: DATOS INCOMPLETOS.");

            if(confirm("🏛️ SEGURIDAD ORBIS: ¿CONFIRMA EL REGISTRO EN RED MAESTRA?")) {
                const tbody = document.getElementById('cuerpo-tabla-prov');
                const rowId = 'row-' + Date.now();
                tbody.innerHTML += `<tr id="${rowId}"><td>${document.getElementById('prov_cat').value}</td><td style="font-weight:bold">${n}</td><td>${r}</td><td>${p}</td><td style="color:var(--gold-soft); font-size:10px;">${USUARIO_ACTUAL}</td><td><button onclick="confirmarEliminar('${n}','${rowId}','${USUARIO_ACTUAL}')" style="background:none; border:none; color:#d9534f; cursor:pointer; font-size:10px; font-weight:bold; text-transform:uppercase;">Eliminar</button></td></tr>`;
                document.getElementById('provModal').style.display = 'none';
            }
        }

        function confirmarEliminar(nombreProv, rowId, propietario) {
            if (propietario !== USUARIO_ACTUAL) { alert(`🏛️ BLOQUEO: SOLO EL DUEÑO ELIMINA.`); return; }
            if(confirm(`🏛️ ADVERTENCIA: ¿ELIMINAR A [ ${nombreProv} ] DE LA RED MAESTRA?`)) document.getElementById(rowId).remove();
        }
    </script>
</body>
</html>
