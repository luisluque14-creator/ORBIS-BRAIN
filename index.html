<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBIS BRAIN | Master Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-soft: #f1d592;
            --black-deep: #0a0a0a;
            --black-mate: #121212;
            --gray-border: #333;
            --text-main: #e0e0e0;
        }

        body {
            background-color: var(--black-mate);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px;
            background-color: var(--black-deep);
            border-right: 1px solid var(--gold);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .logo-text {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 24px;
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        /* --- CONTENIDO --- */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #121212 100%);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--gray-border);
            padding-bottom: 20px;
        }

        .btn-gold {
            background: linear-gradient(45deg, #d4af37, #f1d592);
            color: #000;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            transition: 0.3s;
        }

        .btn-gold:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }

        /* --- TABLA DE REGISTRO ESPEJO --- */
        .table-container {
            background: rgba(0,0,0,0.5);
            border-radius: 15px;
            border: 1px solid var(--gray-border);
            padding: 25px;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            text-align: left;
            color: var(--gold);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 15px;
            border-bottom: 1px solid var(--gray-border);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #222;
            font-size: 13px;
        }

        .status-pill {
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* --- MODAL --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--black-deep);
            border: 2px solid var(--gold);
            padding: 40px;
            border-radius: 20px;
            width: 700px;
        }

        .form-row { display: flex; gap: 20px; margin-bottom: 20px; }
        .form-group { flex: 1; }
        label { display: block; color: var(--gold-soft); font-size: 11px; margin-bottom: 8px; }
        input, select {
            width: 100%;
            background: #161616;
            border: 1px solid var(--gray-border);
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-text">ORBIS</div>
        <p style="font-size: 10px; text-align: center; letter-spacing: 2px; color: var(--gold-soft);">BRAIN NETWORK</p>
        <div style="margin-top: 40px; color: var(--gold); font-size: 13px;">🏛️ Master Dashboard</div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1 style="font-family: 'Cinzel';">Bienvenido, <span style="color:var(--gold)">Luis Alfredo</span></h1>
            <button class="btn-gold" onclick="openModal()">Nueva Operación +</button>
        </div>

        <div class="table-container">
            <h2 style="font-family: 'Cinzel'; font-size: 18px; margin-top: 0;">Registro Espejo (Sincronizado)</h2>
            <table id="tabla-orbis">
                <thead>
                    <tr>
                        <th>ID OPERACIÓN</th>
                        <th>ALIADO</th>
                        <th>MONTO TOTAL</th>
                        <th>NETO PROVEEDOR</th>
                        <th>ESTADO</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla">
                    </tbody>
            </table>
            <div id="loader" style="text-align: center; padding: 20px; color: #555;">Sincronizando rieles...</div>
        </div>
    </div>

    <div id="opModal" class="modal">
        <div class="modal-content">
            <h2 style="font-family: 'Cinzel'; color: var(--gold); text-align: center;">ORQUESTACIÓN DE FONDOS</h2>
            <div class="form-row">
                <div class="form-group"><label>Aliado</label><input type="text" id="aliado_name"></div>
                <div class="form-group"><label>Proveedor</label><input type="text" id="proveedor_name"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Monto Total ($)</label><input type="number" id="monto_total"></div>
                <div class="form-group"><label>Comisión Aliado ($)</label><input type="number" id="val_aliado"></div>
            </div>
            <div class="form-group" style="margin-bottom: 25px;">
                <label>Tipo de Seguro</label>
                <select id="tipo_seguro">
                    <option value="interno">Protección ORBIS BRAIN ($3.00)</option>
                    <option value="externo">Seguro Externo ($0.00)</option>
                </select>
            </div>
            <button class="btn-gold" id="btn_enviar" onclick="enviarAlCerebro()" style="width: 100%;">ACTIVAR RIELES Y CARGAR</button>
            <button onclick="closeModal()" style="width: 100%; background:none; border:none; color:#555; margin-top:15px; cursor:pointer;">CANCELAR</button>
        </div>
    </div>

    <script>
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbwx34Vu9no8Pgp-VS2c5tvoYAPv80xzKPyo7VsDPppq7tm4shv6NxIpIoT9KqM8AcQUXg/exec";

        function openModal() { document.getElementById('opModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('opModal').style.display = 'none'; }

        // LEER DATOS DE GOOGLE SHEETS
        async function cargarHistorial() {
            try {
                const respuesta = await fetch(URL_SCRIPT);
                const datos = await respuesta.json();
                const tabla = document.getElementById('cuerpo-tabla');
                const loader = document.getElementById('loader');
                
                tabla.innerHTML = "";
                loader.style.display = "none";

                datos.reverse().forEach(op => {
                    tabla.innerHTML += `
                        <tr>
                            <td style="font-family: monospace; color: var(--gold-soft);">${op.id}</td>
                            <td>${op.aliado}</td>
                            <td style="font-weight: bold;">$${parseFloat(op.monto).toFixed(2)}</td>
                            <td style="color: #4CAF50;">$${parseFloat(op.neto).toFixed(2)}</td>
                            <td><span class="status-pill">${op.estado}</span></td>
                        </tr>
                    `;
                });
            } catch (e) {
                console.log("Esperando datos...");
            }
        }

        // ENVIAR DATOS A GOOGLE SHEETS
        async function enviarAlCerebro() {
            const btn = document.getElementById('btn_enviar');
            const payload = {
                aliado: document.getElementById('aliado_name').value,
                proveedor: document.getElementById('proveedor_name').value,
                monto: document.getElementById('monto_total').value,
                comision_aliado: document.getElementById('val_aliado').value,
                tipo_seguro: document.getElementById('tipo_seguro').value
            };

            if(!payload.monto || !payload.aliado) return alert("Completa los datos, socio.");

            btn.innerText = "INYECTANDO EN RIELES...";
            btn.disabled = true;

            try {
                await fetch(URL_SCRIPT, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload)
                });
                alert("¡Operación Exitosa!");
                location.reload();
            } catch (e) {
                alert("Error en la conexión.");
                btn.disabled = false;
            }
        }

        // Cargar datos al iniciar
        window.onload = cargarHistorial;
    </script>
</body>
</html>
