<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBIS BRAIN | Master Dashboard v8.5</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- ESTILOS RAIZ Y SIDEBAR (SAGRADOS) --- */
        :root {
            --black-mate: #121212; --black-deep: #0a0a0a; --gold-metalic: #d4af37;
            --gold-soft: #f1d592; --gray-dark: #1e1e1e; --gray-border: #333; --text-main: #e0e0e0;
            --gold-gradient: linear-gradient(90deg, transparent, #d4af37, #f1d592, #d4af37, transparent);
        }
        body { background-color: var(--black-mate); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background-color: var(--black-deep); border-right: 1px solid var(--gold-metalic); padding: 25px; display: flex; flex-direction: column; z-index: 1000; }
        .logo-container { text-align: center; margin-bottom: 40px; border-bottom: 1px solid var(--gray-border); padding-bottom: 20px; }
        .logo-text { font-family: 'Cinzel', serif; color: var(--gold-metalic); font-size: 26px; letter-spacing: 4px; font-weight: 700; margin-top: 10px; }
        .nav-btn { background: transparent; border: 1px solid transparent; color: #888; padding: 15px; text-align: left; font-family: 'Cinzel'; font-size: 12px; letter-spacing: 2px; cursor: pointer; transition: 0.3s; margin-bottom: 10px; border-radius: 8px; width: 100%; }
        .nav-btn.active { color: var(--gold-metalic); border: 1px solid var(--gold-metalic); background: rgba(212, 175, 55, 0.1); }
        .view-section { display: none; flex: 1; height: 100vh; overflow-y: auto; background-image: radial-gradient(circle at center, #1a1a1a 0%, #121212 100%); }
        .view-section.active { display: block; }
    </style>
    
    </head>
<body>

    <script>
        const USUARIO_ACTUAL = "LUIS_ALFREDO";
        const TASAS = { "$": 1.00, "Bs.": 45.00, "€": 0.93, "د.إ": 3.67 };
    </script>

    <div class="sidebar">
        <div class="logo-container">
            <div class="logo-text">ORBIS</div>
            <div style="font-size: 9px; color: var(--gold-soft); letter-spacing: 2px;">BRAIN NETWORK</div>
        </div>
        <button class="nav-btn active" onclick="showView('certificacion', this)">🏛️ Certificaciones</button>
        <button class="nav-btn" onclick="showView('directorio', this)">👥 Directorio Maestro</button>
    </div>

    <div id="view-certificacion" class="view-section active">
        </div>

    <div id="view-directorio" class="view-section">
        </div>

    <script>
        function showView(vId, btn) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('view-' + vId).classList.add('active');
            btn.classList.add('active');
        }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        
        </script>
</body>
</html>
